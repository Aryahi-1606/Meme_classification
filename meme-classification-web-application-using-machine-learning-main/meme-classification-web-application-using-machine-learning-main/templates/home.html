<!DOCTYPE html>
<html>
<head>
    <title>Meme Sentiment Analyzer</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            width: 400px;
            margin: auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        input[type="file"] {
            margin: 20px 0;
        }
        button {
            padding: 10px 20px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧠 Meme Sentiment Analyzer</h1>
        <p>Upload a meme to analyze its sentiment</p>

        <form action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required><br>
            <button type="submit">Analyze</button>
        </form>
    </div>
</body>
</html>
